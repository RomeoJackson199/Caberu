name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"

env:
  SUPABASE_PROJECT_REF: gjvxcisbaxhhblhsytar

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51
        with:
          version: latest

      - name: Deploy all edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            # Skip shared utilities (not deployable as standalone functions)
            if [ "$name" = "_shared" ]; then
              continue
            fi
            echo "Deploying $name..."
            supabase functions deploy "$name" \
              --project-ref "$SUPABASE_PROJECT_REF" || echo "⚠️  Failed to deploy $name, continuing..."
          done
